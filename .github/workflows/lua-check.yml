name: Project checks and device package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 parser
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Validate LÖVE Lua sources
        run: |
          luac5.1 -p love/main.lua
          luac5.1 -p love/conf.lua
          sh -n mux_launch.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate source and package tooling
        run: |
          python -m py_compile service/device_probe.py tools/build_muxapp.py
          pytest -q

  muxapp:
    runs-on: ubuntu-latest
    needs: [lua, python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build installable RG35XX H package
        run: python tools/build_muxapp.py --output dist/CometDesk-dev.muxapp
      - name: Publish installable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CometDesk-muOS-Andromeda-RG35XX-H
          path: |
            dist/CometDesk-dev.muxapp
            dist/CometDesk-dev.muxapp.sha256
          if-no-files-found: error
          retention-days: 30
